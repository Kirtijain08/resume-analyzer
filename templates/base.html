<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .btn-custom {
            background-color: #ffffff;
            color: #6c63ff;
            font-weight: 600;
            border-radius: 30px;
            padding: 10px 30px;
        }

        .btn-custom:hover {
            background-color: #f1f1f1;
        }

        textarea, input[type="file"] {
            border-radius: 10px !important;
        }
        .form-control:focus {
           box-shadow: 0 0 10px rgba(255,255,255,0.5);
           border-color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-5">
    <a class="navbar-brand fw-bold text-white" href="/">AI Resume Analyzer</a>
    <div class="ms-auto">
        <a class="text-white me-3" href="/">Home</a>
        <a class="text-white me-3" href="/login">Login</a>
        <a class="text-white" href="/register">Register</a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    {% block content %}{% endblock %}
</div>

</body>
</html>
