{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<div class="glass-card text-center w-100" style="max-width: 800px;">

    <h1 class="display-4 fw-bold mb-3">
        🚀 AI Resume Analyzer
    </h1>

    <p class="mb-4">
        Instantly match your Resume with a Job Description and get 
        smart insights powered by AI.
    </p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Upload Resume (PDF)</label>
            <input type="file" name="resume_pdf" class="form-control" accept=".pdf" required>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label fw-semibold">Paste Job Description</label>
            <textarea name="jd" rows="5" class="form-control" required></textarea>
        </div>

        <button type="submit" class="btn btn-custom btn-lg">
            Analyze Resume
        </button>

    </form>

</div>

{% endblock %}
